name: ✅ Feature request
description: A request for a new feature or improvement
type: Feature

body:

  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to submit an issue!

        **Please provide as much information as you have available. The more information we have, the better.**

        ## Details

  - type: textarea
    id: description
    attributes:
      label: Describe the feature you'd like to request
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist for new issues
      options:
        - label: I will abide by the CivicBand [Code of Conduct](https://github.com/civicband/.github/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: I have searched the existing issues and believe this is not a duplicate
          required: true
